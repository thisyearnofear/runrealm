# RunRealm Netlify Configuration
# Minimal deployment config following Core Principles: ENHANCEMENT FIRST, DRY, CLEAN

[build]
  # Build shared packages first, then the Next.js web app (apps/web/dist).
  command = "npm run build"
  # Next.js static export outputs to apps/web/dist
  publish = "apps/web/dist"
  # Skip builds for non-functional changes
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF || exit 1"

# Exclude mobile app from web builds to avoid React Native dependency conflicts
[build.environment]
  # Only install dependencies needed for web build
  NETLIFY_USE_YARN = "false"
  # Next.js 16 requires Node >= 20.9.0
  NODE_VERSION = "20"
  # Install devDependencies for build
  NPM_FLAGS = "--include=dev"

# Redirects are now handled by public/_redirects file

[functions]
  # Static export + serverless broker for the Orbis/Reactor scoped JWT.
  directory = "netlify/functions"

# Security & Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    # CORS for external API access (Mapbox, Web3 providers)
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS, PUT, PATCH, DELETE"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    # Security hardening
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    # See apps/web/public/_headers: the desk handoff carries a preview centre
    # in the URL, and no-referrer-when-downgrade would send it to the basemap
    # provider as the Referer on every tile.
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Report-only for now, and the policy itself is explained in
    # apps/web/public/_headers. Both files must stay in step -- the test in
    # privacy-headers.test.ts enforces that. Keep the two strings identical.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' wasm-unsafe-eval blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self' data: blob: https://tiles.openfreemap.org https://server.arcgisonline.com https://api.mapbox.com https://www.strava.com https://api.reactor.inch wss://api.reactor.inch https://mainnet.infura.io https://cloudflare-eth.com https://polygon-rpc.com https://rpc-amoy.polygon.technology https://ethereum-sepolia-rpc.publicnode.com https://zetachain-evm.blockpi.network https://zetachain-athens-evm.blockpi.network; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

# HTML files should not be cached to prevent stale references
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Root index.html gets extra aggressive cache prevention
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"
    Last-Modified = "Thu, 01 Jan 1970 00:00:00 GMT"
    ETag = ""

# MIME Type Headers (CRITICAL FIX for Chrome/Brave compatibility)
# Using individual headers for better Netlify compatibility
# MIME Type Headers (CRITICAL FIX) - Alternative syntax
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/*.map"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# Cache headers for static assets
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache optimization for static assets
[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"