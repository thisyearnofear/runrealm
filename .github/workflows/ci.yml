name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, so a header that quietly stopped being served is noticed without
  # anyone having to remember to look. See the deployed-headers job.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check game-rules sync
        run: npm run sync:check

  test:
    needs: setup
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]
        package:
          [shared-core, shared-types, shared-utils, shared-blockchain, web]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests for ${{ matrix.package }}
        run: npm run test --workspace=@runrealm/${{ matrix.package }}

      - name: Build shared packages first (web resolves them via dist/)
        run: npm run build:shared

      - name: Build ${{ matrix.package }}
        run: npm run build --workspace=@runrealm/${{ matrix.package }}

  server-tests:
    # `server/__tests__` covers the Express API and the pure grant modules
    # behind the Vercel functions in `api/`. These were run by nobody: the
    # reactor-token test kept passing against a Netlify function that had
    # been deleted weeks earlier, and nothing noticed because nothing ran it.
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run server tests
        run: npm run test:server

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint code
        run: npm run lint:check

  # TODO: temporarily disable security check
  # security:
  #   needs: setup
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v4

  #   - name: Security audit
  #     run: npm audit --audit-level moderate

  build-all:
    needs: [test, lint, server-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Build all packages
        run: npm run build

      - name: Build web application
        run: npm run build:web
        env:
          NODE_ENV: production
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

  deploy-staging:
    needs: build-all
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for staging
        run: npm run build
        env:
          NODE_ENV: staging
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment"
          # Add actual deployment commands here

  deploy-production:
    needs: build-all
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}

      - name: Deploy to production
        run: |
          echo "Deploying to production environment"
          # Add actual deployment commands here

  deployed-headers:
    # Asserts the headers on the wire, not in the repo.
    #
    # This is not part of the deploy pipeline because Vercel deploys through
    # its own Git integration -- the deploy-* jobs below are stubs, so a
    # post-deploy step there would never run and would look like a safeguard
    # while checking nothing. Instead this polls the real URL.
    #
    # It exists because the Referrer-Policy fix was applied to two configs,
    # neither of which served production, and stayed broken for two releases
    # with every test green.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Check production serves the configured security headers
        # Optional. Set the repo variable to check a different host; with it
        # unset the script falls back to the production URL it already knows.
        env:
          RUNREALM_URL: ${{ vars.RUNREALM_PRODUCTION_URL }}
        run: node scripts/validation/check-deployed-headers.js
