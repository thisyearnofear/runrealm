name: atlas-vr-xr-smoke

on:
  workflow_dispatch:

jobs:
  xr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:shared && npm run build --workspace=@runrealm/web
      - name: Install XR emulator runtime
        run: |
          curl -sL "https://unpkg.com/immersive-web-emulator/dist/iwer.min.js" -o scripts/qa/iwer.min.js
          cp scripts/qa/iwer.min.js apps/web/dist/iwer.min.js
          python3 - <<'PYEOF'
          from pathlib import Path
          html = Path('apps/web/dist/atlas-vr/index.html')
          s = html.read_text()
          boot = '<script src="/iwer.min.js"></script><script>try{var d=new IWER.XRDevice(IWER.metaQuest3);d.stereoEnabled=true;d.installRuntime({forceInstall:true});}catch(e){}</script>'
          if 'iwer.min.js' not in s:
              s = s.replace('</head>', boot + '</head>')
              html.write_text(s)
          PYEOF
      - name: Serve static export
        run: |
          cd apps/web/dist
          python3 -m http.server 3001 --bind 127.0.0.1 &
          sleep 2
      - name: Run WebXR harness
        run: node scripts/qa/atlas-vr-xr-harness.mjs http://127.0.0.1:3001 artifacts
        env:
          CHROME_BIN: google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xr-harness-artifacts
          path: artifacts/
