# Lefthook configuration for RunRealm monorepo
# https://github.com/evilmartians/lefthook

# Pre-commit hooks - run on staged files
pre-commit:
  parallel: true
  commands:
    # Prevent stale compiled .js files from being committed
    check-stale-js:
      run: |
        if git diff --cached --name-only | grep -q "^src/components/.*\.js$"; then
          echo "❌ ERROR: Stale compiled .js files detected in src/components/"
          echo "Only TypeScript (.ts) source files should be committed."
          echo "Delete the .js files and let the build system regenerate them."
          exit 1
        fi
      fail_text: "Stale compiled JavaScript files detected. Remove them before committing."

    lint:
      run: npx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
      glob: "**/*.{ts,tsx,js,jsx,json}"

    # Hardcoded credential scan. Cheap (only staged files), catches
    # AWS/GitHub/OpenAI/Anthropic/Google/Stripe/Slack/Mapbox/PEM/JWT
    # patterns. See scripts/secrets-scan.sh for allowlist + details.
    secrets-scan:
      run: bash scripts/secrets-scan.sh staged
      fail_text: "Hardcoded secret detected. See scripts/secrets-scan.sh output."

    # `window.RunRealm` is a console debug handle, not a wiring mechanism.
    # Runs on staged files only; the full-tree version runs pre-push.
    no-window-runrealm:
      run: node scripts/check/no-window-runrealm.mjs {staged_files}
      glob: "**/*.{ts,tsx,js,jsx,mjs}"
      fail_text: "Application code must not read window.RunRealm. Inject the dependency instead."

# Pre-push hooks - run before pushing to remote
pre-push:
  parallel: false
  commands:
    # Scan files changed since origin/main for hardcoded secrets.
    # Catches secrets that landed in earlier commits before the hook
    # existed. ~1s for normal PR sizes.
    secrets-scan-push:
      run: bash scripts/secrets-scan.sh pushed
      fail_text: "Hardcoded secret in a commit about to push. See scripts/secrets-scan.sh output."

    # Run tests for all packages
    test:
      run: npm run test
      fail_text: "Tests failed. Please fix the failing tests before pushing."

    # Run lint check (only fail on actual errors, not style warnings)
    lint-check:
      run: npm run lint:errors --silent
      fail_text: "Critical linting errors found. Please fix actual errors before pushing."

    # Whole-tree version of the pre-commit check: catches a read that was
    # already in the tree rather than introduced in this push.
    no-window-runrealm-full:
      run: node scripts/check/no-window-runrealm.mjs
      fail_text: "Application code must not read window.RunRealm. Inject the dependency instead."

    # Type check with TypeScript compiler
    typecheck:
      run: npm run build:shared
      fail_text: "Type checking failed. Please fix TypeScript errors before pushing."

